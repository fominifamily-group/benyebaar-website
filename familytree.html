<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Tree</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <body>

<div class="tree-container">

<h1>The Benyebaar Family Tree</h1>

<a href="home.html" class="back-btn">
Back Home
</a>

<div id="family-tree"></div>

</div>

</div>
<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "AIzaSyA7FCPSsD0n0J6-D0UnxIu4VwTjopyyil8",
  authDomain: "benyebaar-family.firebaseapp.com",
  projectId: "benyebaar-family",
  storageBucket: "benyebaar-family.firebasestorage.app",
  messagingSenderId: "657772594344",
  appId: "1:657772594344:web:843e51ede1f0e499f32e9d",
  measurementId: "G-ERS3ZCXVGQ"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const familyTree = document.getElementById("family-tree");

async function loadFamilyMembers(){

const snapshot = await getDocs(collection(db, "familyMembers"));

const groupedFamilies = {};

snapshot.forEach((doc) => {

const data = doc.data();

if(!groupedFamilies[data.family]){

groupedFamilies[data.family] = [];

}

groupedFamilies[data.family].push(data);

});

familyTree.innerHTML = "";

for(const familyName in groupedFamilies){

familyTree.innerHTML += `

<div class="family-group">

<h2 class="family-title">

${familyName}

</h2>

<div class="children">

${groupedFamilies[familyName].map(member => `

<div class="member child">

<img src="${member.photo}">

<h2>${member.name}</h2>

<p>${member.role}</p>

</div>

`).join("")}

</div>

</div>

`;

}

}

loadFamilyMembers();

</script>
</body>

</body>

</html>

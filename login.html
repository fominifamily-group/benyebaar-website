<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

flex-direction:column;

font-family:Arial;

background:#f2f2f2;

margin:0;

}

input{

width:80%;

max-width:300px;

padding:15px;

margin:10px;

font-size:18px;

border-radius:8px;

border:1px solid gray;

}

button{

width:85%;

max-width:320px;

padding:15px;

font-size:18px;

border:none;

border-radius:8px;

background:#007bff;

color:white;

cursor:pointer;

}

h1{

text-align:center;

}

</style>
  <title>Login</title>
</head>

<body>

<h1>Family Login</h1>

<input type="email" id="email" placeholder="Enter Email">

<br><br>

<input type="password" id="password" placeholder="Enter Password">

<br><br>

<button id="login-btn">
Login
</button>
<br><br>

<a href="signup.html">

<button>
Create Account
</button>

</a>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyA7FCPSsD0n0J6-D0UnxIu4VwTjopyyiI8",

authDomain: "benyebaar-family.firebaseapp.com",

projectId: "benyebaar-family",

storageBucket: "benyebaar-family.firebasestorage.app",

messagingSenderId: "657772594344",

appId: "1:657772594344:web:843e51ede1f0e499f32e9d",

measurementId: "G-ERS3ZCXVGQ"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const loginBtn = document.getElementById("login-btn");

loginBtn.addEventListener("click", async () => {

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try {

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("Login successful!");

window.location.href = "chat.html";

}

catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
